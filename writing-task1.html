<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Writing Task 1 — Band 6.5 → 8.0</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEEAE0;
    --paper-line:#D7D0BC;
    --card:#F8F6EE;
    --ink:#232A2E;
    --ink-soft:#5B6266;
    --red:#B04A32;
    --red-soft:#C9694F;
    --gold:#9C7A2E;
    --green:#4E6B52;
    --green-soft:#E4EADD;
    --white:#FFFFFF;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size: 28px 28px;
    background-attachment: fixed;
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:36px 20px 80px;}

  /* header */
  header{margin-bottom:28px;}
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--red);font-weight:600;margin-bottom:10px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(30px,6vw,44px);
    line-height:1.05;
    margin:0 0 10px;
    letter-spacing:-0.01em;
  }
  h1 em{font-style:italic;color:var(--red-soft);}
  .sub{
    color:var(--ink-soft);
    font-size:15px;line-height:1.55;max-width:52ch;margin:0 0 24px;
  }

  /* chart card */
  .chart-card{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:20px 22px 16px;
    margin-bottom:22px;
    position:relative;
  }
  .chart-top{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:6px;flex-wrap:wrap;gap:8px;
  }
  .chart-title{font-family:'Fraunces',serif;font-weight:600;font-size:16px;}
  .chart-current{
    font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-soft);
  }
  .chart-current b{color:var(--red);font-size:16px;}
  svg.chart{display:block;width:100%;height:auto;}
  .chart-caption{
    font-size:11.5px;color:var(--ink-soft);margin-top:6px;font-style:italic;
  }

  /* stats row */
  .stats{
    display:flex;gap:14px;flex-wrap:wrap;margin-bottom:30px;
  }
  .stat{
    flex:1;min-width:130px;
    background:var(--white);
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:14px 16px;
  }
  .stat .num{
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:24px;color:var(--ink);
  }
  .stat .lbl{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .progress-outer{
    height:6px;background:var(--paper-line);border-radius:4px;overflow:hidden;margin-top:10px;
  }
  .progress-inner{height:100%;background:var(--red-soft);border-radius:4px;transition:width .4s ease;}

  /* section header */
  .section-head{
    display:flex;align-items:baseline;gap:10px;
    margin:36px 0 14px;
    border-bottom:2px solid var(--ink);
    padding-bottom:8px;
  }
  .section-head .tag{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;
    background:var(--ink);color:var(--paper);padding:3px 8px;border-radius:4px;
  }
  .section-head h2{
    font-family:'Fraunces',serif;font-size:19px;font-weight:600;margin:0;
  }

  /* lesson card */
  .lesson{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    margin-bottom:12px;
    overflow:hidden;
    transition:border-color .2s ease;
  }
  .lesson.done{border-color:var(--green);}
  .lesson-head{
    display:flex;align-items:center;gap:12px;
    padding:13px 16px;cursor:pointer;user-select:none;
  }
  .lesson-num{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;color:var(--white);background:var(--ink);
    width:26px;height:26px;border-radius:6px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .lesson.done .lesson-num{background:var(--green);}
  .lesson-title{
    font-family:'Fraunces',serif;font-weight:500;font-size:15.5px;flex:1;
  }
  .lesson-frac{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);flex-shrink:0;
  }
  .chevron{
    width:16px;height:16px;flex-shrink:0;color:var(--ink-soft);
    transition:transform .2s ease;
  }
  .lesson.open .chevron{transform:rotate(180deg);}
  .lesson-body{
    max-height:0;overflow:hidden;transition:max-height .25s ease;
  }
  .lesson.open .lesson-body{max-height:400px;}
  .lesson-body-inner{
    padding:0 16px 14px 54px;
    display:flex;flex-direction:column;gap:9px;
  }
  .sub-item{
    display:flex;align-items:flex-start;gap:9px;cursor:pointer;
  }
  .sub-item input[type=checkbox]{
    margin-top:2px;width:16px;height:16px;accent-color:var(--red);flex-shrink:0;cursor:pointer;
  }
  .sub-item span{font-size:13.5px;line-height:1.4;color:var(--ink);}
  .sub-item.checked span{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--green);}
  .note-row{margin-top:4px;}
  .note-row input{
    width:100%;font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;
    border:1px dashed var(--paper-line);background:var(--white);
    border-radius:6px;padding:7px 10px;color:var(--ink);
  }
  .note-row input::placeholder{color:#B3ABA0;}
  .note-row input:focus{outline:none;border-color:var(--red-soft);}

  footer{
    margin-top:40px;padding-top:18px;border-top:1px solid var(--paper-line);
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
  }
  .reset-btn{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--red);
    background:none;border:1px solid var(--red-soft);border-radius:6px;
    padding:8px 14px;cursor:pointer;
  }
  .reset-btn:hover{background:var(--red);color:var(--white);}
  .save-state{font-size:11px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}

  .loading{
    padding:60px 0;text-align:center;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:13px;
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading" id="loading">Đang tải tiến độ…</div>
</div>

<script>
const STORAGE_KEY = 'wt1-progress-v1';

// ---- Lesson data (structure/titles only — from the book's table of contents) ----
const SECTIONS = [
  {
    tag: 'SECTION 1',
    title: 'Developing Task 1 Academic Writing Skills',
    lessons: [
      {n:1, title:'Task achievement', subs:['Common problems in Task 1','How and why you may be practising Band 3–5','Writing a conclusion in Task 1']},
      {n:2, title:'Coherence and cohesion problems in Task 1', subs:['Is coherence & cohesion different in Task 1?','Coherence & cohesion between and within sentences','Lack of progression and clear organisation']},
      {n:3, title:'Getting Started', subs:['Step 1: Noticing details','Step 2: Identifying key features','Step 3: Organising information']},
      {n:4, title:'Introductory sentences', subs:['The introductory sentence','Paraphrasing the test question','Introducing map and plan tasks']},
      {n:5, title:'The Overview and Highlighting Key Features', subs:['The overview','Writing a clear overview','Presenting and highlighting key features']},
      {n:6, title:'Line Graphs', subs:['Understanding line graphs','Addressing Band 6 problems','Model answer']},
      {n:7, title:'Map Tasks', subs:['How map tasks are different','Common problems in map tasks','Model answer']},
      {n:8, title:'Being Precise in Map and Plan Tasks', subs:['Common language problems','Addressing band 6 problems','Model answer']},
      {n:9, title:'Process Tasks (1)', subs:['Language used in process tasks','Coherence and cohesion','Model answer and improving short answers']},
      {n:10, title:'Process Tasks (2)', subs:['Trends vs. steps vs. stages','Changing the language in the question','Model answer']},
    ]
  },
  {
    tag: 'SECTION 2',
    title: 'Test Practice',
    lessons: [
      {n:'—', title:'Key Ideas about Test Practice', subs:['Đọc phần giới thiệu trước khi luyện đề']},
      {n:'—', title:'Useful Practice Activities', subs:['Đọc qua các hoạt động luyện tập gợi ý']},
      {n:11, title:'Guided Test Practice 1 — Data about People (1)', subs:['Understanding the data','Changing the language in the question','Model answer and language review']},
      {n:12, title:'Guided Test Practice 2 — Data about People (2)', subs:['Writing about gender and age','Timed test practice + general statements','Model answer']},
      {n:13, title:'Pie Charts, Stacked Bar Charts, and Future Predictions', subs:['Dealing with pie charts','Test practice and being precise','Model answer and stacked bar charts']},
      {n:14, title:'Frequency and Grouping Information Logically', subs:['Describing frequency','Grouping information logically','Model answer']},
      {n:15, title:'Data about Energy and Problems', subs:['Data about energy','Model answer','Cause and effect in Task 1']},
      {n:16, title:'Reviewing Process Tasks', subs:['Dealing with technical details','Test practice 1: Energy','Test practice 2: Life cycle']},
      {n:17, title:'Review of Map Tasks and Task 1', subs:['Reviewing map and plan tasks','A "user approach" to maps and plans','Review of Task 1 language and style']},
      {n:18, title:'Timed Test Practice 1', subs:['Test practice 1 — Bar chart','Test practice 2 & 3 — Map task and pie charts','Model answers, points to notice, key features']},
      {n:19, title:'Timed Test Practice 2', subs:['Test practice 4 — A table','Test practice 5 — A process task','Test practice 6 — A line graph']},
      {n:20, title:'Timed Test Practice 3', subs:['Test practice 7 — A bar chart','Test practice 8 — A process task','Test practice 9 — A stacked bar chart']},
    ]
  }
];

// flat id list for storage
function subId(sIdx, lIdx, subIdx){ return `s${sIdx}-l${lIdx}-i${subIdx}`; }
function noteId(sIdx, lIdx){ return `s${sIdx}-l${lIdx}-note`; }

let state = { checked:{}, notes:{}, open:{} };

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      state.checked = parsed.checked || {};
      state.notes = parsed.notes || {};
    }
  }catch(e){ /* no saved data yet */ }
}

let saveTimer = null;
function saveState(){
  const el = document.getElementById('save-indicator');
  if(el) el.textContent = 'Đang lưu…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify({checked:state.checked, notes:state.notes}), false);
      if(el) el.textContent = 'Đã lưu ✓';
    }catch(e){
      if(el) el.textContent = 'Lỗi lưu — thử lại';
    }
  }, 300);
}

function totalCounts(){
  let total=0, done=0;
  SECTIONS.forEach((sec,sIdx)=>{
    sec.lessons.forEach((lesson,lIdx)=>{
      lesson.subs.forEach((_,subIdx)=>{
        total++;
        if(state.checked[subId(sIdx,lIdx,subIdx)]) done++;
      });
    });
  });
  return {total, done};
}

// per-lesson completion ratio, only for the 20 numbered lessons (for the chart x-axis)
function lessonRatios(){
  const ratios = [];
  SECTIONS.forEach((sec,sIdx)=>{
    sec.lessons.forEach((lesson,lIdx)=>{
      if(typeof lesson.n !== 'number') return;
      let done=0;
      lesson.subs.forEach((_,subIdx)=>{ if(state.checked[subId(sIdx,lIdx,subIdx)]) done++; });
      ratios.push({n:lesson.n, ratio: done/lesson.subs.length});
    });
  });
  return ratios.sort((a,b)=>a.n-b.n);
}

function renderChart(){
  const ratios = lessonRatios();
  const W=680, H=170, padL=38, padR=14, padT=14, padB=26;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const n = ratios.length;
  const bandFor = (cumRatio) => 6.5 + cumRatio*1.5;

  // cumulative average completion up to each lesson gives a smoother climbing line
  let running = 0, points = [];
  ratios.forEach((r,i)=>{
    running += r.ratio;
    const avgSoFar = running/(i+1);
    const x = padL + (plotW*(i/(n-1)));
    const y = padT + plotH - (avgSoFar*plotH);
    points.push([x,y]);
  });

  const path = points.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const lastPoint = points[points.length-1];
  const {total,done} = totalCounts();
  const overallRatio = total? done/total : 0;
  const currentBand = (6.5 + overallRatio*1.5).toFixed(1);

  const gridLines = [0,0.25,0.5,0.75,1].map(f=>{
    const y = padT + plotH - f*plotH;
    const label = (6.5+f*1.5).toFixed(1);
    return `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--paper-line)" stroke-width="1"/>
      <text x="${padL-8}" y="${y+3}" font-size="9.5" font-family="IBM Plex Mono, monospace" fill="var(--ink-soft)" text-anchor="end">${label}</text>`;
  }).join('');

  const xTicks = [1,5,10,15,20].map(lessonN=>{
    const idx = ratios.findIndex(r=>r.n===lessonN);
    if(idx<0) return '';
    const x = padL + (plotW*(idx/(n-1)));
    return `<text x="${x}" y="${H-6}" font-size="9.5" font-family="IBM Plex Mono, monospace" fill="var(--ink-soft)" text-anchor="middle">L${lessonN}</text>`;
  }).join('');

  return `
  <div class="chart-top">
    <div class="chart-title">Biểu đồ tiến độ (Band 6.5 → 8.0)</div>
    <div class="chart-current">Hiện tại: <b>~${currentBand}</b> · ${done}/${total} mục</div>
  </div>
  <svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    ${gridLines}
    ${xTicks}
    <path d="${path}" fill="none" stroke="var(--red)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${lastPoint ? `<circle cx="${lastPoint[0]}" cy="${lastPoint[1]}" r="4.5" fill="var(--red)" stroke="var(--card)" stroke-width="2"/>` : ''}
  </svg>
  <div class="chart-caption">* Đường minh hoạ động lực dựa trên % hoàn thành checklist, không phải điểm dự đoán chính thức.</div>
  `;
}

function renderStats(){
  const {total,done} = totalCounts();
  const pct = total? Math.round((done/total)*100) : 0;
  return `
    <div class="stat">
      <div class="num">${done}/${total}</div>
      <div class="lbl">Mục đã hoàn thành</div>
    </div>
    <div class="stat">
      <div class="num">${pct}%</div>
      <div class="lbl">Toàn bộ sách</div>
      <div class="progress-outer"><div class="progress-inner" style="width:${pct}%"></div></div>
    </div>
  `;
}

function renderLesson(sec, sIdx, lesson, lIdx){
  const doneCount = lesson.subs.filter((_,subIdx)=>state.checked[subId(sIdx,lIdx,subIdx)]).length;
  const isDone = doneCount===lesson.subs.length;
  const openKey = `s${sIdx}-l${lIdx}`;
  const isOpen = !!state.open[openKey];
  const nId = noteId(sIdx,lIdx);
  const noteVal = state.notes[nId] || '';

  const subsHtml = lesson.subs.map((label,subIdx)=>{
    const id = subId(sIdx,lIdx,subIdx);
    const checked = !!state.checked[id];
    return `
      <label class="sub-item ${checked?'checked':''}" data-subid="${id}">
        <input type="checkbox" ${checked?'checked':''} data-subid="${id}">
        <span>${label}</span>
      </label>`;
  }).join('');

  return `
    <div class="lesson ${isDone?'done':''} ${isOpen?'open':''}" data-lessonkey="${openKey}">
      <div class="lesson-head" data-lessonkey="${openKey}">
        <div class="lesson-num">${lesson.n}</div>
        <div class="lesson-title">${lesson.title}</div>
        <div class="lesson-frac">${doneCount}/${lesson.subs.length}</div>
        <svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7l5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="lesson-body">
        <div class="lesson-body-inner">
          ${subsHtml}
          <div class="note-row">
            <input type="text" placeholder="Ghi chú riêng (từ vựng cần học, lỗi hay mắc...)" data-noteid="${nId}" value="${noteVal.replace(/"/g,'&quot;')}">
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderSection(sec, sIdx){
  return `
    <div class="section-head">
      <span class="tag">${sec.tag}</span>
      <h2>${sec.title}</h2>
    </div>
    ${sec.lessons.map((lesson,lIdx)=>renderLesson(sec,sIdx,lesson,lIdx)).join('')}
  `;
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <header>
      <div class="eyebrow">Writing Task 1 · The Key to IELTS</div>
      <h1>Từ Band 6.5 lên <em>8.0</em></h1>
      <p class="sub">Theo dõi tiến độ đọc &amp; luyện tập theo từng Lesson trong sách. Tick khi hoàn thành để thấy đường tiến độ đi lên.</p>
    </header>

    <div class="chart-card" id="chart-card">${renderChart()}</div>

    <div class="stats">${renderStats()}</div>

    ${SECTIONS.map((sec,sIdx)=>renderSection(sec,sIdx)).join('')}

    <footer>
      <button class="reset-btn" id="reset-btn">Xoá toàn bộ tiến độ</button>
      <span class="save-state" id="save-indicator">Đã lưu ✓</span>
    </footer>
  `;

  // checkbox handlers
  app.querySelectorAll('input[type=checkbox][data-subid]').forEach(cb=>{
    cb.addEventListener('change', (e)=>{
      const id = e.target.getAttribute('data-subid');
      state.checked[id] = e.target.checked;
      saveState();
      rerenderPartial();
    });
  });

  // note handlers
  app.querySelectorAll('input[data-noteid]').forEach(inp=>{
    inp.addEventListener('input', (e)=>{
      const id = e.target.getAttribute('data-noteid');
      state.notes[id] = e.target.value;
      saveState();
    });
    inp.addEventListener('click', e=>e.stopPropagation());
  });

  // lesson expand/collapse
  app.querySelectorAll('.lesson-head').forEach(head=>{
    head.addEventListener('click', (e)=>{
      const key = head.getAttribute('data-lessonkey');
      state.open[key] = !state.open[key];
      render();
    });
  });

  // reset
  const resetBtn = document.getElementById('reset-btn');
  if(resetBtn){
    resetBtn.addEventListener('click', async ()=>{
      if(confirm('Xoá toàn bộ tiến độ đã lưu? Hành động này không thể hoàn tác.')){
        state = {checked:{}, notes:{}, open:{}};
        saveState();
        render();
      }
    });
  }
}

// lighter re-render for just chart+stats after a checkbox toggle (avoid losing open state / focus)
function rerenderPartial(){
  const chartCard = document.getElementById('chart-card');
  if(chartCard) chartCard.innerHTML = renderChart();
  const statsEls = document.querySelectorAll('.stats')[0];
  if(statsEls) statsEls.innerHTML = renderStats();
  // update lesson done-state classes and fractions without full re-render
  document.querySelectorAll('.lesson').forEach(lessonEl=>{
    const key = lessonEl.getAttribute('data-lessonkey');
    const [sIdx,lIdx] = key.replace('s','').split('-l').map(Number);
    const lesson = SECTIONS[sIdx].lessons[lIdx];
    const doneCount = lesson.subs.filter((_,subIdx)=>state.checked[subId(sIdx,lIdx,subIdx)]).length;
    lessonEl.classList.toggle('done', doneCount===lesson.subs.length);
    const frac = lessonEl.querySelector('.lesson-frac');
    if(frac) frac.textContent = `${doneCount}/${lesson.subs.length}`;
    lessonEl.querySelectorAll('.sub-item').forEach(item=>{
      const id = item.getAttribute('data-subid');
      item.classList.toggle('checked', !!state.checked[id]);
    });
  });
}

(async function init(){
  await loadState();
  render();
})();
</script>
</body>
</html>
